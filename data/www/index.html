<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoConfig</title>
</head>

<body>
    <h1>Configure your Pomodormo</h1>
    <form method="/" action="POST">
        <label for="counterTime">Counterclockwise 90 degrees: </label>
        <input type="number" name="counterTime" />
        <label for="normalTime">Normal: </label>
        <input type="number" name="normalTime" />
        <label for="clockTime">Clockwise: </label>
        <input type="number" name="clockTime" />
        <label for="invertTime">Flipped: </label>
        <input type="number" name="invertTime" />
    </form>
</body>

</html>
